:root {
	--surface: #160f0c;
	--surface-container: #251914;
	--on-surface: #f6ecdc;
	--primary: #f0a640;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--on-surface);
	background-color: var(--surface);
	overflow: hidden;
	touch-action: none;
	font-family: 'Lexend', system-ui, sans-serif;
	font-weight: 500;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: var(--surface);
	z-index: 1;
}

/* the engine's boot splash with stretch mode Keep: the whole picture, centred, never cropped */
#status-splash {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	object-fit: contain;
}

/* low and centred, where ui/cover.gd draws its bar; one size for a phone and a laptop */
#status-box {
	position: absolute;
	left: 50%;
	bottom: max(56px, 10vh);
	transform: translateX(-50%);
	width: min(520px, calc(100vw - 32px));
	display: flex;
	flex-direction: column;
	gap: 10px;
	text-align: center;
}

#status-line {
	font-size: 22px;
	line-height: 30px;
	text-shadow: 0 0 4px var(--surface), 0 0 8px var(--surface);
	font-variant-numeric: tabular-nums;
}

#status-bar {
	position: relative;
	height: 18px;
	box-sizing: border-box;
	border: 2px solid color-mix(in srgb, var(--primary) 60%, transparent);
	border-radius: 9px;
	background: color-mix(in srgb, var(--surface-container) 90%, transparent);
	overflow: hidden;
}

#status-fill {
	height: 100%;
	width: 0;
	border-radius: 7px;
	background: var(--primary);
	transition: width 0.2s linear;
}

/* while the engine starts: a soft light sweeps the full bar every 2 s, so it never looks stuck (no flashing) */
#status-bar.busy::after {
	content: '';
	position: absolute;
	inset: 0;
	background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
	transform: translateX(-100%);
	animation: sweep 2s ease-in-out infinite;
}

@keyframes sweep {
	to { transform: translateX(100%); }
}

@media (prefers-reduced-motion: reduce) {
	#status-fill { transition: none; }
	#status-bar.busy::after { animation: none; display: none; }
}

#status-notice {
	display: none;
	margin-top: 6px;
	padding: 12px 16px;
	border-radius: 8px;
	background: var(--surface-container);
	border: 2px solid var(--primary);
	font-size: 18px;
	line-height: 26px;
	text-align: center;
}

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Please turn on JavaScript to play.
		</noscript>

		<div id="status">
			<img id="status-splash" src="index.png" alt="Outpost Gale">
			<div id="status-box">
				<div id="status-line" aria-live="polite">Downloading the base...</div>
				<div id="status-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="status-fill"></div></div>
				<div id="status-notice" role="alert"></div>
			</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":71177224,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusLine = document.getElementById('status-line');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-fill');
	const statusNotice = document.getElementById('status-notice');
	// every file the engine fetches, with its size, so the total never jumps when the second download starts
	const sizes = Object.values(GODOT_CONFIG['fileSizes'] || {});
	const total = sizes.reduce((a, b) => a + b, 0);
	const mb = (bytes) => Math.round(bytes / 1048576);

	function setBar(fraction) {
		statusFill.style.width = `${Math.round(fraction * 100)}%`;
		statusBar.setAttribute('aria-valuenow', String(Math.round(fraction * 100)));
	}

	// ui/cover.gd calls this on the first frame it is drawn: the game's own cover takes over from here
	window.shellDone = function () {
		statusOverlay.remove();
	};

	// a phone plays full screen and landscape. A browser allows both only inside a press, and the engine reads input
	// a frame later, outside it, so the page asks itself. iPhone Safari has neither for a page: ignored there.
	if (matchMedia('(pointer: coarse)').matches) {
		document.getElementById('canvas').addEventListener('pointerup', function () {
			const page = document.documentElement;
			if (document.fullscreenElement || !page.requestFullscreen) {
				return;
			}
			page.requestFullscreen({ navigationUI: 'hide' })
				.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
				.catch(() => {});
		}, { once: true });
	}

	function displayFailureNotice(err) {
		console.error(err);
		statusLine.textContent = 'The game could not start.';
		statusBar.style.display = 'none';
		let text = 'An unknown error occurred.';
		if (err instanceof Error) {
			text = err.message;
		} else if (typeof err === 'string') {
			text = err;
		}
		statusNotice.textContent = `Try reloading the page. (${text})`;
		statusNotice.style.display = 'block';
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			displayFailureNotice(`This browser cannot run the game. Missing: ${missing.join(', ')}`);
		}
	} else {
		engine.startGame({
			'onProgress': function (current) {
				if (total > 0 && current < total) {
					statusLine.textContent = `Downloading the base... ${mb(current)} MB of ${mb(total)} MB`;
					setBar(current / total);
				} else if (total > 0) {
					statusLine.textContent = 'Getting ready...';
					setBar(1);
					statusBar.classList.add('busy');
				}
			},
		}).then(() => {
			// downloaded and started; the screen stays until the game's cover is drawn (shellDone)
			statusLine.textContent = 'Getting ready...';
			setBar(1);
			statusBar.classList.add('busy');
		}, displayFailureNotice);
	}
}());
		</script>
